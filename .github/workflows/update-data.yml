name: 공공데이터 자동 갱신

on:
  schedule:
    - cron: "0 20 2 * *"   # 매월 3일 오전 5시(한국시간)
  workflow_dispatch:        # 수동 실행 버튼

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 자료 받아오기와 검증
        env:
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python3 scripts/update_data.py
      - name: 바뀐 경우에만 저장
        run: |
          if [ -n "$(git status --porcelain data.json history.json ids.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            for f in data.json history.json ids.json; do if [ -f "$f" ]; then git add "$f"; fi; done
            git commit -m "공공데이터 자동 갱신"
            git push
          else
            echo "변경 없음"
          fi
